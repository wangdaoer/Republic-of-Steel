name: Steel Republic Checkers

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write   # 供 github/codeql-action/upload-sarif 写入代码扫描结果

jobs:
  check:
    name: Consistency & Timeline Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run consistency check
        run: python tools/consistency-check/consistency_check.py

      - name: Run timeline check
        run: python tools/timeline-check/timeline_check.py

      - name: Upload checker reports (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checker-reports
          path: |
            tools/consistency-check/last-run.json
            tools/timeline-check/last-run.json

      - name: Upload consistency SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tools/consistency-check/last-run.sarif
          category: consistency-check

      - name: Upload timeline SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tools/timeline-check/last-run.sarif
          category: timeline-check
